<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>光屿室内星空测试靶</title>
<style>
html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block}
button{position:absolute;right:16px;bottom:16px;background:#10141d;color:#b8c5d7;border:1px solid #283144;border-radius:8px;padding:8px 12px;font:13px system-ui}
:fullscreen button{display:none}
</style>
</head>
<body><canvas aria-label="暗底星场，带缓慢旋转、固定地景和偶发亮线"></canvas>
<button type="button" id="full">全屏星场</button>
<script>
const canvas = document.querySelector('canvas'), ctx = canvas.getContext('2d', {alpha:false});
document.getElementById('full').onclick = () => document.documentElement.requestFullscreen?.();
let seed = 305419896;
function rand() {
  seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
  return seed / 4294967296;
}
const stars = Array.from({length: 155}, () => {
  const magnitude = rand();
  return [rand() * 1.24 - 0.62, rand() * 1.24 - 0.62, 1.05 + (1-magnitude)**3 * 2.45,
          44 + Math.round((1-magnitude)**2 * 210), rand()];
});
const start = performance.now();
function draw(now) {
  const width = canvas.clientWidth, height = canvas.clientHeight, dpr = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(width*dpr) || canvas.height !== Math.round(height*dpr)) {
    canvas.width = Math.round(width*dpr); canvas.height = Math.round(height*dpr);
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const t = (now - start) / 1000;
  const sky = ctx.createLinearGradient(0, 0, width * 0.7, height);
  sky.addColorStop(0, '#02040a'); sky.addColorStop(1, '#0c0d14');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, width, height);
  const scale = Math.max(width, height);
  ctx.save(); ctx.translate(width*0.39, height*0.42); ctx.rotate(t * 0.0075);
  for (const [x,y,r,l,tone] of stars) {
    const px = x*scale, py=y*scale;
    const rgb = tone < 0.35 ? [l*0.8,l*0.91,l] : tone < 0.65 ? [l,l,l*0.97] : [l,l*0.88,l*0.74];
    const gradient = ctx.createRadialGradient(px,py,0,px,py,r);
    gradient.addColorStop(0, 'rgb('+rgb.map(Math.round).join(',')+')');
    gradient.addColorStop(1, 'transparent');
    ctx.fillStyle = gradient; ctx.fillRect(px-r,py-r,2*r,2*r);
  }
  ctx.restore();
  const phase = t % 18;
  if (phase > 13.0 && phase < 13.8) {
    ctx.strokeStyle = 'rgba(220,231,245,.72)'; ctx.lineWidth = 1.4;
    ctx.beginPath(); ctx.moveTo(width*.15,height*.43); ctx.lineTo(width*.78,height*.28); ctx.stroke();
  }
  ctx.fillStyle = '#080908'; ctx.beginPath(); ctx.moveTo(0,height);
  for (let x=0;x<width+5;x+=5) {
    const edge = height*(.89 + .025*Math.sin(x*.013) + .018*Math.sin(x*.042)) - ((x%95)<3 ? 18 : 0);
    ctx.lineTo(x,edge);
  }
  ctx.lineTo(width,height); ctx.fill();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
</script></body></html>
